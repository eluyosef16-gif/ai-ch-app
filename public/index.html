<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple AI chat app built with HTML, CSS, JavaScript and Gemini.">
  <title>My AI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo">H<span>AI</span></div>
      <h2>My AI Chat</h2>
      <p class="small-text">Your simple AI chat assistant</p>

      <button class="new-btn" id="newChatBtn">+ New Chat</button>

      <div class="menu-title">QUICK QUESTIONS</div>
      <button class="quick-btn" data-prompt="Explain HTML to me like a beginner.">What is HTML?</button>
      <button class="quick-btn" data-prompt="What is CSS and why do we use it?">What is CSS?</button>
      <button class="quick-btn" data-prompt="Explain JavaScript in a simple way.">What is JavaScript?</button>

      <div class="sidebar-bottom">
        <button class="theme-btn" id="themeBtn">🌙 Dark Mode</button>
        <button class="clear-btn" id="clearBtn">Clear Chat</button>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div>
          <h1>My AI Chat</h1>
          <p><span class="online-dot"></span> Gemini assistant</p>
        </div>
      </header>

      <section class="chat" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">AI</div>
          <h2>Hello! 👋</h2>
          <p>Ask me anything. I can help with learning, coding, writing and ideas.</p>
          <div class="welcome-buttons">
            <button data-prompt="Give me 5 beginner web development project ideas.">💡 Project ideas</button>
            <button data-prompt="Teach me the basics of JavaScript.">📚 Learn JavaScript</button>
          </div>
        </div>
      </section>

      <div class="composer-area">
        <div class="status" id="status"></div>
        <div class="composer">
          <textarea id="prompt" rows="1" maxlength="2000" placeholder="Type your message..."></textarea>
          <div class="composer-footer">
            <span id="counter">0 / 2000</span>
            <span class="hint">Enter = send · Shift + Enter = new line</span>
            <button class="send-btn" id="sendBtn">Send</button>
          </div>
        </div>
        <p class="note">My AI Chat may make mistakes. Check important information.</p>
      </div>
    </main>
  </div>

  <div class="overlay" id="overlay"></div>
  <script src="script.js"></script>
</body>
</html>
